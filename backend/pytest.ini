[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast deterministic unit tests with no external I/O
    integration: Integration tests between internal Relay components
    security: Security regression tests (auth, ssrf, rce, tenant isolation)
    e2e: End-to-end user goal execution tests with FakeLLM and fake servers
    live: Tests requiring live environment services (Ollama, live OAuth, external APIs)
