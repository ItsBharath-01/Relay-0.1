version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: relay_postgres
    restart: always
    environment:
      POSTGRES_USER: relay_user
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: relay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_user -d relay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relay_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://relay_user:relay_password@db:5432/relay_db
      - SECRET_KEY=change_this_to_a_secure_random_jwt_secret_in_production_32b
      - ENCRYPTION_KEY=W03_3n9D3vE10pm3ntK3yF0rR31ay02App11cat1onS3cur1ty=
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:1.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
